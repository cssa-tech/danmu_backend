# 弹幕系统的 nginx 配置（由 deploy/setup.sh 安装到 /etc/nginx/sites-available/danmu）
#   http://服务器地址/          → 手机端（观众发弹幕）
#   http://服务器地址/screen/   → 大屏幕端（显示弹幕）
#   http://服务器地址/ws        → 转发到后端 WebSocket（127.0.0.1:8080）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 手机端
    location / {
        root /var/www/danmu/mobile;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 大屏幕端
    location /screen/ {
        root /var/www/danmu;
        index index.html;
        try_files $uri $uri/ /screen/index.html;
    }

    # WebSocket 后端
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
